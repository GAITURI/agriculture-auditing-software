<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <script src="env.js"></script>
  <script src="js/theme-init.js"></script>
  <title>Field entry · SCIPEC Operations</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="field-entry.html" data-title="Field entry" data-perm="fruit:write" data-subtitle="Record a day of harvest and collection for a block">
  <a class="visually-hidden-focusable" href="#content">Skip to content</a>
  <div class="d-flex min-vh-100">
    <aside id="sidebar" class="offcanvas offcanvas-start nav-drawer" tabindex="-1" aria-label="Navigation"></aside>
    <div class="flex-grow-1 d-flex flex-column min-w-0">
      <header id="topbar" class="topbar"></header>
      <main id="content" class="flex-grow-1 p-3 p-lg-4">
        <div class="row g-3">
          <div class="col-xl-8"><form id="entryForm" class="card" novalidate>
            <div class="card-pad pb-0"><div class="alert alert-danger d-none form-error" role="alert"></div>
              <section class="form-section">
                <h2 class="sec-title"><span class="num">1</span>When and where</h2>
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label" for="date">Date</label>
                    <input class="form-control" type="date" id="date" name="date" required aria-describedby="dateText dateFb">
                    <div class="d-flex flex-wrap align-items-center gap-2 mt-2"><div class="seg" id="dateChips" role="group" aria-label="Quick dates"><button type="button" data-d="0" aria-pressed="false">Today</button><button type="button" data-d="1" aria-pressed="false">Yesterday</button><button type="button" data-d="2" aria-pressed="false">2 days ago</button></div></div>
                    <div class="form-text" id="dateText"></div><div class="fb text-danger small d-none" id="dateFb" role="status"></div></div>
                  <div class="col-12"><span class="form-label d-block" id="blkLabel">Block</span><div class="blk-group" role="radiogroup" aria-labelledby="blkLabel" id="blocks"></div><div class="fb text-danger small d-none" id="blockFb" role="status"></div></div>
                </div></section>
              <div class="alert alert-warning d-none" id="allDone" role="status"></div></div>
            <fieldset id="qtyFields" class="bare card-pad pt-2">
              <section class="form-section">
                <h2 class="sec-title"><span class="num">2</span>Quantities</h2>
                <div class="row g-3">
                  <div class="col-md-4"><label class="form-label" for="harvested">Harvested</label><div class="input-group"><input class="form-control" type="number" id="harvested" name="harvested" min="0" step="0.001" inputmode="decimal" required placeholder="0.000"><span class="input-group-text">t</span></div><div class="fb text-danger small d-none" role="status"></div></div>
                  <div class="col-md-4"><label class="form-label" for="collected">Collected</label><div class="input-group"><input class="form-control" type="number" id="collected" name="collected" min="0" step="0.001" inputmode="decimal" placeholder="0.000"><span class="input-group-text">t</span></div><div class="fb text-danger small d-none" role="status"></div></div>
                  <div class="col-md-4"><label class="form-label" for="transported">Transported to factory</label><div class="input-group"><input class="form-control" type="number" id="transported" name="transported" min="0" step="0.001" inputmode="decimal" placeholder="0.000"><span class="input-group-text">t</span></div><div class="fb text-danger small d-none" role="status"></div></div>
                  <div class="col-12"><div class="left-tile" id="leftTile"><div><div class="small fw-semibold">Fruit left in field</div><div class="small" id="leftMsg">Calculated from harvested and collected</div></div><div class="text-end"><strong class="fs-3"><span id="leftVal">–</span></strong> <span>t</span></div></div>
                    <div class="meter mt-2" aria-hidden="true"><i id="meterBar" style="width:0"></i></div></div>
                  <div class="col-12 d-none" id="reasonGroup"><label class="form-label" for="shortfall_reason">Why was fruit left in the field? <span class="text-danger">*</span></label><input class="form-control" id="shortfall_reason" name="shortfall_reason" maxlength="300" placeholder="e.g. rain delay, truck did not arrive"><div class="fb text-danger small d-none" role="status"></div></div>
                </div></section>
              <section class="form-section">
                <h2 class="sec-title"><span class="num">3</span>Crew and notes <span class="opt">optional</span></h2>
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label" for="harvesters">Harvesters</label><input class="form-control" type="number" id="harvesters" name="harvesters" min="0" step="1" inputmode="numeric" placeholder="0"></div>
                  <div class="col-md-6"><label class="form-label" for="collectors">Collectors</label><input class="form-control" type="number" id="collectors" name="collectors" min="0" step="1" inputmode="numeric" placeholder="0"></div>
                  <div class="col-12"><label class="form-label" for="remarks">Supervisor remarks</label><textarea class="form-control" id="remarks" name="remarks" rows="2" maxlength="500" placeholder="Weather, access problems, anything the office should know"></textarea></div>
                </div></section>
              <div class="form-actions"><button class="btn btn-outline-primary" type="submit" id="saveDraft">Save as draft</button><button class="btn btn-primary d-none" type="button" id="saveSubmit">Save and submit</button><span class="small text-muted ms-auto align-self-center d-none d-md-inline" id="nextHint"></span></div>
            </fieldset></form></div>
          <div class="col-xl-4 d-flex flex-column gap-3">
            <section class="card card-pad"><h2 class="panel-title mb-1">Blocks on <span id="covDate">this date</span></h2><p class="small text-muted mb-2" id="covSummary">Checking…</p><ul class="list-unstyled cover mb-0" id="coverage"></ul></section>
            <section class="card card-pad"><div class="d-flex justify-content-between align-items-center mb-2"><h2 class="panel-title">Latest records</h2><a class="small" href="records.html">All records</a></div><ul class="list-unstyled cover small mb-0" id="recent"></ul></section></div></div>
      </main>
      <footer class="px-4 py-3 tw-text-sm tw-text-gray-600">SCIPEC · <a href="https://scipec.vercel.app" target="_blank" rel="noopener">scipec.vercel.app</a></footer>
    </div>
  </div>
  <div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/field-entry.js"></script>
</body>
</html>
